services:
  - type: web
    name: science-diagram-maker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste the key in the Render dashboard, never in this file
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: NODE_VERSION
        value: "22"
